name: Deploy

# Deploys main to the server after CI passed (or by hand). The server pulls the
# code and rebuilds with docker compose; see docs/deploy-hetzner.md.
# Secrets: DEPLOY_HOST, DEPLOY_SSH_KEY (private key of the server's deploy user).
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    steps:
      - name: Deploy over SSH
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          if [ -z "$HOST" ] || [ -z "$KEY" ]; then
            echo "::notice::DEPLOY_HOST / DEPLOY_SSH_KEY not set; skipping deploy."
            exit 0
          fi
          mkdir -p ~/.ssh
          install -m 600 /dev/null ~/deploy_key
          printf '%s\n' "$KEY" > ~/deploy_key
          ssh-keyscan -H "$HOST" >> ~/.ssh/known_hosts
          ssh -i ~/deploy_key "deploy@$HOST" "bash /srv/build-advisor/deploy/deploy.sh"
