# Local development: `docker compose up` starts Django, Celery, Postgres (pgvector) and Redis.
# With an NVIDIA GPU: docker compose -f docker-compose.yml -f docker-compose.gpu.yml up
services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: build_advisor
      POSTGRES_PASSWORD: build_advisor
      POSTGRES_DB: build_advisor
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U build_advisor"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  web: &app
    image: build-advisor:cpu
    build:
      context: .
      args:
        INSTALL_DEV: "true"
        EMBEDDINGS: cpu
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgres://build_advisor:build_advisor@db:5432/build_advisor
      CELERY_BROKER_URL: redis://redis:6379/0
      DJANGO_DEBUG: "true"
      DJANGO_ALLOWED_HOSTS: "*"
    command: sh -c "python manage.py migrate --noinput && python manage.py runserver 0.0.0.0:8000"
    ports:
      - "8000:8000"
    volumes:
      - .:/app
      - hf_cache:/root/.cache/huggingface  # bge-m3 weights (~2 GB), downloaded once
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  # React dev server with live reload: http://localhost:5173 (forwards /api to Django).
  frontend:
    image: node:22-slim
    working_dir: /frontend
    command: sh -c "npm ci --no-audit --no-fund && npm run dev"
    environment:
      VITE_API_TARGET: http://web:8000
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/frontend
      - frontend_node_modules:/frontend/node_modules
    depends_on:
      - web

  worker:
    <<: *app
    build: !reset null # reuses the image built for web instead of building it twice
    pull_policy: never
    command: celery -A config worker --loglevel=info --concurrency=1
    ports: []

volumes:
  pgdata:
  hf_cache:
  frontend_node_modules:
