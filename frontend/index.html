<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Ask questions about Path of Exile builds. Answers come from the Path of Exile wiki, with sources." />
    <title>Build Advisor</title>
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg" />
    <meta name="theme-color" content="#211c18" />
    <!-- Link previews. Django fills in __SITE_URL__ / __PAGE_URL__ (they need absolute URLs). -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Build Advisor" />
    <meta property="og:title" content="Build Advisor: Path of Exile build questions, answered with sources" />
    <meta
      property="og:description"
      content="Ask about Path of Exile builds. Answers cite the community wiki, and Path of Building runs the numbers on your own build."
    />
    <meta property="og:url" content="__PAGE_URL__" />
    <meta property="og:image" content="__SITE_URL__%BASE_URL%og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Build Advisor: answers cite the community wiki; Path of Building runs the numbers." />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Alegreya:ital,wght@0,400;0,500;0,700;1,400&family=Alegreya+SC:wght@500;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
