# GPU override for machines with an NVIDIA card (Docker Desktop + WSL2 on Windows works).
#   docker compose -f docker-compose.yml -f docker-compose.gpu.yml up --build
# Builds the CUDA variant of PyTorch and gives the Celery worker the GPU.
services:
  web:
    image: build-advisor:cuda  # separate tag so a CPU build never replaces it
    build:
      args:
        EMBEDDINGS: cuda

  worker:
    image: build-advisor:cuda
    environment:
      EMBEDDING_DEVICE: cuda
    # The solo pool runs tasks in the main process: no CUDA-after-fork problems.
    command: celery -A config worker --loglevel=info --pool=solo
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
