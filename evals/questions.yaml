# --- Follow-up questions (the earlier turns are given) -----------------------------

- id: followup-bleed-after-poison
  question: And how does that work for bleeding?
  category: conversation
  history:
    - question: How do multiple poisons on the same enemy work?
      answer: Poisons stack without limit. Every poison on an enemy deals its own chaos damage over time, so more poisons mean more damage.
  expected_sources: [Bleeding]
  must_mention: [[strongest, highest]]

- id: followup-rf-damage-type
  question: What type of damage does it deal?
  category: conversation
  history:
    - question: What does Righteous Fire do?
      answer: Righteous Fire burns you and nearby enemies every second, based on your maximum life and energy shield.
  expected_sources: [Righteous Fire]
  must_mention: [fire]

- id: followup-freeze-then-chill
  question: How is that different from chill?
  category: conversation
  history:
    - question: What does freezing an enemy do?
      answer: A frozen enemy can't move or act until the freeze ends.
  expected_sources: [Chill, Freeze]
  must_mention: [[slow, slower, reduced action speed, action speed]]

