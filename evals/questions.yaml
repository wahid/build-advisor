# Evaluation set for build-advisor.
#
# Fields
#   id               unique slug
#   question         what a user would type
#   category         mechanic | gem | unique | ascendancy | unanswerable | build
#   expected_sources wiki page titles that should be retrieved (any one counts for hit@k)
#   must_mention     facts the answer must contain. Each entry is a phrase or a list of
#                    alternatives; matching is case-insensitive. Keep these to facts that
#                    have been stable for many leagues, so a patch doesn't break the set.
#   answerable       false = the wiki doesn't cover it; the answer must say so
#   requires_pob     true = needs Path of Building tools (skipped when PoB isn't available)
#   expect_tools     PoB tools the model should call (build cases)
#   doc_types        optional search filter, as in the UI

