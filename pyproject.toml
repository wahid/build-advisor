[project]
name = "build-advisor"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "celery>=5.7.0",
    "dj-database-url>=3.1.2",
    "django>=6.1.3",
    "django-environ>=0.14.0",
    "djangorestframework>=3.18.3",
    "gunicorn>=27.0.0",
    "openai>=3.49.0",
    "pathofbuilding-mcp>=0.5",
    "pgvector>=0.5.1",
    "psycopg[binary]>=3.3.8",
    "redis>=8.1.0",
    "requests[socks]>=2.34.2",
    "whitenoise>=6.12.0",
]

[project.optional-dependencies]
# Embedding runtime. Pick exactly one: `uv sync --extra cpu` or `uv sync --extra cuda`.
cpu = ["torch>=2.15", "sentence-transformers>=6.2"]
cuda = ["torch>=2.15", "sentence-transformers>=6.2"]

[tool.uv]
conflicts = [[{ extra = "cpu" }, { extra = "cuda" }]]

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", extra = "cpu" },
    { index = "pytorch-cu132", extra = "cuda" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu132"
url = "https://download.pytorch.org/whl/cu132"
explicit = true

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-django>=4.14.0",
    "pytest-mock>=3.17.0",
    "responses>=0.26.3",
    "ruff>=0.17.4",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["test_*.py"]
testpaths = ["tests"]
addopts = "-ra"
filterwarnings = ["ignore:No directory at:UserWarning"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["wiki/migrations"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "DJ", "SIM"]
